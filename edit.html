<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>编辑 · Riano</title>
  <meta name="theme-color" content="#070914">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="editor/editor.css">
</head>
<body data-page="edit">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="nav-root"></div>
  <main class="studio-wrap">
    <section class="panel gate" id="gate" hidden>
      <p class="kicker"><span class="star">✦</span>LOGIN</p>
      <h1>登录</h1>
      <p>用 GitHub 账号 Riano5589 登录。登录之后可以改 HOME、碎碎念和关于，也可以按关键词搜索全部内容。</p>
      <p>第一次登录会跳到 GitHub。创建应用后，安装时只勾选 <strong>Riano5589.github.io</strong> 这个仓库。</p>
      <button class="tool-btn primary" id="login" type="button">用 GitHub 登录</button>
    </section>
    <section id="studio" hidden>
      <div class="studio-top">
        <div class="section-switch" role="tablist">
          <button class="tool-btn" type="button" data-section="home">HOME</button>
          <button class="tool-btn" type="button" data-section="notes">碎碎念</button>
          <button class="tool-btn" type="button" data-section="about">关于</button>
        </div>
        <button class="tool-btn" id="logout" type="button">退出</button>
      </div>
      <div class="studio">
        <aside class="panel library">
          <label for="query">搜索全部内容</label>
          <input id="query" type="search" placeholder="标题、README、碎碎念、关于" autocomplete="off">
          <div id="search-hits"></div>
          <div id="list-tools">
            <button class="new-entry" id="create" type="button"><span class="new-mark" aria-hidden="true">+</span><span>新的一篇</span></button>
            <p class="count" id="count"></p>
            <div id="results"></div>
          </div>
        </aside>
        <form class="panel composer" id="composer">
            <h1 id="heading">新的一篇</h1>
          <div id="text-fields">
            <label for="title">标题</label>
            <input id="title" type="text" maxlength="120">
            <div id="home-fields" hidden>
              <label for="github">GitHub 链接</label>
              <input id="github" type="url" inputmode="url" placeholder="https://github.com/..." maxlength="300">
            </div>
            <label for="date">日期</label>
            <input id="date" type="date">
            <label id="body-label" for="body">正文</label>
            <textarea id="body"></textarea>
            <div id="md-preview" class="md-preview body md" hidden></div>
          </div>
          <div id="about-fields" hidden>
            <label for="contact">联系方式</label>
            <textarea id="contact"></textarea>
            <label for="intro">介绍</label>
            <textarea id="intro"></textarea>
          </div>
          <div class="composer-actions">
            <button class="tool-btn" id="add-md" type="button" hidden>上传 Markdown</button>
            <button class="tool-btn" id="add-image" type="button">插入图片 / GIF</button>
            <button class="tool-btn" id="add-video" type="button">插入视频</button>
            <button class="tool-btn primary" id="save" type="button">保存</button>
            <button class="tool-btn danger" id="remove" type="button">删除这篇</button>
            <button class="tool-btn" id="publish" type="button">发布到 GitHub</button>
          </div>
          <input id="md-file" type="file" multiple hidden>
          <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,.gif" hidden>
          <input id="video-file" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" hidden>
        </form>
      </div>
    </section>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="js/stars.js"></script>
  <script src="js/marked.umd.js"></script>
  <script src="js/content.js"></script>
  <script src="js/shell.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
